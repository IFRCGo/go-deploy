# https://github.com/toggle-corp/helm-charts/tree/main/toggle/raw
#
# Generic host-redirect Ingresses via Traefik. To add another redirect,
# just append an entry to `redirects` below - no other changes needed.
#
# name: DNS-safe, unique; used to derive resource names (<name>-placeholder/-redirect/-ingress)
# host: subdomain must be under *.ifrc.org to be covered by the wildcard-helm-secret-cert
# tlsSecretName: reuse wildcard-helm-secret-cert unless the host needs its own cert

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: go-redirects
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: ghcr.io/toggle-corp/helm-charts
    chart: raw
    targetRevision: v0.1.0
    helm:
      valuesObject:
        ingressClassName: traefik
        redirects:
          - name: go-user-library
            host: go-user-library.ifrc.org
            redirectUrl: "https://www.chromatic.com/library?appId=66557be6b68dacbf0a96db23&branch=develop"
            tlsSecretName: wildcard-helm-secret-cert
        templates:
          - |
            apiVersion: v1
            kind: List
            items:
              {{- range $r := .Values.redirects }}
              - apiVersion: v1
                kind: Service
                metadata:
                  name: {{ $r.name }}-placeholder
                spec:
                  ports:
                    - port: 80
                      targetPort: 80
              {{- end }}
          - |
            apiVersion: v1
            kind: List
            items:
              {{- range $r := .Values.redirects }}
              - apiVersion: traefik.io/v1alpha1
                kind: Middleware
                metadata:
                  name: {{ $r.name }}-redirect
                spec:
                  redirectRegex:
                    regex: "^.*"
                    replacement: {{ $r.redirectUrl | quote }}
                    permanent: true
              {{- end }}
          - |
            apiVersion: v1
            kind: List
            items:
              {{- range $r := .Values.redirects }}
              - apiVersion: networking.k8s.io/v1
                kind: Ingress
                metadata:
                  name: {{ $r.name }}-ingress
                  annotations:
                    traefik.ingress.kubernetes.io/router.middlewares: {{ $.Release.Namespace }}-{{ $r.name }}-redirect@kubernetescrd
                spec:
                  ingressClassName: {{ $.Values.ingressClassName }}
                  tls:
                    - hosts:
                        - {{ $r.host }}
                      secretName: {{ $r.tlsSecretName }}
                  rules:
                    - host: {{ $r.host }}
                      http:
                        paths:
                          - path: /
                            pathType: Prefix
                            backend:
                              service:
                                name: {{ $r.name }}-placeholder
                                port:
                                  number: 80
              {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: go-redirects
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
