# vim: set ft=helm:
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-loki
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - ServerSideApply=true
  sources:
    - chart: loki
      repoURL: https://grafana.github.io/helm-charts
      targetRevision: 6.55.0  # https://github.com/grafana/loki/blob/main/production/helm/loki/Chart.yaml
      helm:
        valuesObject:
          # Copied from https://grafana.com/docs/loki/latest/setup/install/helm/install-monolithic/ - Single Replica
          # TODO Use Multiple Replicas?

          test:
            enabled: false

          # The Loki canary pushes logs to and queries from this loki installation to test
          # that it's working correctly
          lokiCanary:
            enabled: false

          loki:
            auth_enabled: false
            commonConfig:
              replication_factor: 1
            schemaConfig:
              configs:
                - from: "2024-04-01"
                  store: tsdb
                  object_store: s3
                  schema: v13
                  index:
                    prefix: loki_index_
                    period: 24h
            pattern_ingester:
                enabled: true
            limits_config:
              allow_structured_metadata: true
              volume_enabled: true
              max_query_lookback: 2160h # ~3 months (TODO: Is this enough or to much?)
              retention_period: 2160h   # ~3 months (TODO: Is this enough or to much?)
            # XXX: We need this disabled during loki init https://github.com/grafana/loki/issues/9634#issuecomment-2188215203
            #   Also, comment out the limits_config max_query_lookback and retention_period
            compactor:
              working_directory: /var/loki/data/retention
              delete_request_store: s3
              retention_enabled: true
            ruler:
              enable_api: true

          deploymentMode: SingleBinary

          singleBinary:
            replicas: 1

          # XXX: Loki startup slow - https://github.com/grafana/loki/issues/7907#issuecomment-1445336799
          memberlist:
            service:
              publishNotReadyAddresses: true

          # NOTE: Changed due to limited resources
          chunksCache:
            resources:
              requests:
                cpu: "0.1"
                memory: 512Mi

          # FIXME: Replace this with azure blob storage
          minio:
            enabled: true
            persistence:
              enabled: true
              size: 32Gi  # Cost is defined at tier level

          # Zero out replica counts of other deployment modes
          backend:
            replicas: 0
          read:
            replicas: 0
          write:
            replicas: 0

          ingester:
            replicas: 0
          querier:
            replicas: 0
          queryFrontend:
            replicas: 0
          queryScheduler:
            replicas: 0
          distributor:
            replicas: 0
          compactor:
            replicas: 0
          indexGateway:
            replicas: 0
          bloomCompactor:
            replicas: 0
          bloomGateway:
            replicas: 0

    - chart: alloy
      repoURL: https://grafana.github.io/helm-charts
      targetRevision: 1.12.1  # https://github.com/grafana/alloy/blob/main/operations/helm/charts/alloy/Chart.yaml
      helm:
        valuesObject:
          # https://github.com/grafana/alloy/blob/main/operations/helm/charts/alloy/values.yaml
          # Collects pod logs from /var/log/pods and pushes them to Loki.
          # The relabel rules match promtail's `kubernetes-pods` scrape job, so log streams
          # carry the labels Loki queries and dashboards use: app, instance, component,
          # node_name, namespace, job, pod and container.

          # The only CRD this chart ships is PodLogs, which this config does not use
          crds:
            create: false

          controller:
            type: daemonset
            volumes:
              extra:
                - name: storage
                  hostPath:
                    path: /run/alloy
                    type: DirectoryOrCreate

          # Trimmed to what this config needs: `discovery.kubernetes` with role=pod. The chart
          # default also grants cluster-wide configmap/secret reads for unused components.
          # NOTE: Both lists must stay non-empty, the chart renders `[]` into the rule list.
          rbac:
            rules:
              - apiGroups: [""]
                resources: ["pods"]
                verbs: ["get", "list", "watch"]
            clusterRules:
              - apiGroups: [""]
                resources: ["nodes"]
                verbs: ["get", "list", "watch"]

          alloy:
            # No anonymous usage stats to Grafana Labs
            enableReporting: false

            # Read positions are kept on the host so a restarted pod resumes instead of
            # re-sending every log file it tails
            storagePath: /run/alloy

            mounts:
              # Pod log files live under /var/log/pods
              varlog: true
              extra:
                - name: storage
                  mountPath: /run/alloy

            configMap:
              content: |-
                logging {
                  level  = "info"
                  format = "logfmt"
                }

                // HOSTNAME is the node name, so each daemonset pod only watches its own node
                discovery.kubernetes "pods" {
                  role = "pod"

                  selectors {
                    role  = "pod"
                    field = "spec.nodeName=" + sys.env("HOSTNAME")
                  }
                }

                discovery.relabel "pod_logs" {
                  targets = discovery.kubernetes.pods.targets

                  rule {
                    action        = "replace"
                    source_labels = ["__meta_kubernetes_pod_controller_name"]
                    regex         = "([0-9a-z-.]+?)(-[0-9a-f]{8,10})?"
                    target_label  = "__tmp_controller_name"
                  }

                  rule {
                    action        = "replace"
                    source_labels = [
                      "__meta_kubernetes_pod_label_app_kubernetes_io_name",
                      "__meta_kubernetes_pod_label_app",
                      "__tmp_controller_name",
                      "__meta_kubernetes_pod_name",
                    ]
                    regex        = "^;*([^;]+)(;.*)?$"
                    target_label = "app"
                  }

                  rule {
                    action        = "replace"
                    source_labels = [
                      "__meta_kubernetes_pod_label_app_kubernetes_io_instance",
                      "__meta_kubernetes_pod_label_instance",
                    ]
                    regex        = "^;*([^;]+)(;.*)?$"
                    target_label = "instance"
                  }

                  rule {
                    action        = "replace"
                    source_labels = [
                      "__meta_kubernetes_pod_label_app_kubernetes_io_component",
                      "__meta_kubernetes_pod_label_component",
                    ]
                    regex        = "^;*([^;]+)(;.*)?$"
                    target_label = "component"
                  }

                  rule {
                    action        = "replace"
                    source_labels = ["__meta_kubernetes_pod_node_name"]
                    target_label  = "node_name"
                  }

                  rule {
                    action        = "replace"
                    source_labels = ["__meta_kubernetes_namespace"]
                    target_label  = "namespace"
                  }

                  rule {
                    action        = "replace"
                    source_labels = ["namespace", "app"]
                    separator     = "/"
                    replacement   = "$1"
                    target_label  = "job"
                  }

                  rule {
                    action        = "replace"
                    source_labels = ["__meta_kubernetes_pod_name"]
                    target_label  = "pod"
                  }

                  rule {
                    action        = "replace"
                    source_labels = ["__meta_kubernetes_pod_container_name"]
                    target_label  = "container"
                  }

                  rule {
                    action        = "replace"
                    source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
                    separator     = "/"
                    replacement   = "/var/log/pods/*$1/*.log"
                    target_label  = "__path__"
                  }

                  // Static pods (control plane) are keyed by config hash instead of uid
                  rule {
                    action        = "replace"
                    source_labels = [
                      "__meta_kubernetes_pod_annotationpresent_kubernetes_io_config_hash",
                      "__meta_kubernetes_pod_annotation_kubernetes_io_config_hash",
                      "__meta_kubernetes_pod_container_name",
                    ]
                    regex        = "true/(.*)"
                    separator    = "/"
                    replacement  = "/var/log/pods/*$1/*.log"
                    target_label = "__path__"
                  }
                }

                local.file_match "pod_logs" {
                  path_targets = discovery.relabel.pod_logs.output
                }

                loki.source.file "pod_logs" {
                  targets    = local.file_match.pod_logs.targets
                  forward_to = [loki.process.pod_logs.receiver]
                }

                loki.process "pod_logs" {
                  stage.cri {}

                  // Loki's ingester refuses entries older than max_chunk_age/2 (1h), so shipping
                  // them only burns the ingestion rate limit. Happens whenever read positions are
                  // gone (fresh install, node reboot clearing /run) and every file is read in full.
                  stage.drop {
                    older_than          = "1h"
                    drop_counter_reason = "older_than_loki_accepts"
                  }

                  forward_to = [loki.write.default.receiver]
                }

                // publish data to loki
                loki.write "default" {
                  endpoint {
                    url       = "http://monitoring-loki-gateway/loki/api/v1/push"
                    tenant_id = "1"
                  }
                }

          serviceMonitor:
            enabled: true
            # Prometheus only selects ServiceMonitors carrying the kube-prometheus-stack release label
            additionalLabels:
              release: monitoring-kube-prometheus-stack
