# vim: set ft=helm:
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-kube-prometheus-stack
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
  source:
    chart: kube-prometheus-stack
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 70.3.0  # https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/Chart.yaml
    helm:
      valuesObject:
        # https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml
        # https://github.com/grafana/helm-charts/blob/main/charts/grafana/values.yaml
        grafana:
          replicas: 1
          ingress:
            enabled: false
          persistence:
            enabled: false  # Grafana used as readonly
          grafana.ini:
            # https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/
            users:
              viewers_can_edit: true  # https://grafana.com/docs/grafana/latest/administration/user-management/manage-dashboard-permissions/#enable-viewers-to-edit-but-not-save-dashboards-and-use-explore
              default_theme: system
          additionalDataSources:
            - access: proxy
              isDefault: false
              name: Loki
              orgId: 1
              type: loki
              url: http://monitoring-loki-gateway
          dashboardProviders:
            dashboardproviders.yaml:
              apiVersion: 1
              providers:
              - name: "default"
                orgId: 1
                folder: ""
                type: file
                disableDeletion: false
                editable: true
                options:
                  path: /var/lib/grafana/dashboards/default
          dashboards:
            default:
              # Inside cluster metrics
              13646-kubernetes-persistent-volumes:
                gnetId: 13646
                revision: 2
                datasource: Prometheus

        prometheus:
          serviceAccount:
            # Pinned because the federated identity credential's subject in
            # resources/monitoring.tf names it, and a rename breaks blob auth.
            name: monitoring-kube-prometheus-prometheus
            annotations:
              # terraform: module.resources.thanos_workload_identity_client_id
              azure.workload.identity/client-id: "eed9b930-da00-4504-a312-8f4234c4fd01"

          # Headless service `monitoring-kube-prometheus-thanos-discovery` that
          # thanos query (thanos.yaml) finds the sidecar's gRPC endpoint through
          thanosService:
            enabled: true
          # Carries the release label from the chart, so Prometheus selects it
          thanosServiceMonitor:
            enabled: true

          prometheusSpec:
            podMetadata:
              labels:
                # Opts the pod in to the azure workload identity webhook, which
                # injects the token the thanos sidecar's DefaultAzureCredential reads
                azure.workload.identity/use: "true"

            # The thanos sidecar uploads every 2h TSDB block to azure blob. With
            # object storage set, the operator also disables local compaction.
            thanos:
              additionalArgs:
                # Uploads the blocks Prometheus compacted before the sidecar existed.
                # Removed once the old blocks are in blob, together with trimming
                # the local retention.
                - name: shipper.upload-compacted
              objectStorageConfig:
                # The chart renders this into the secret
                # `monitoring-kube-prometheus-prometheus`. Same config as thanos.yaml.
                secret:
                  type: AZURE
                  config:
                    # terraform: module.resources.monitoring_storage_account_name
                    storage_account: ifrcpgoaksmonitoring
                    container: thanos-metrics
                    # terraform owns the container
                    storage_create_container: false
                    # user_assigned_id stays unset: setting it switches thanos to the
                    # IMDS managed identity instead of DefaultAzureCredential, which
                    # is what picks up the workload identity token.

            # TODO: Increase/decrease as needed
            # https://prometheus.io/docs/prometheus/latest/storage/#right-sizing-retention-size
            retentionSize: "20GB"  # Maximum size of metrics
            storageSpec:
              volumeClaimTemplate:
                spec:
                  resources:
                    requests:
                      storage: 32Gi  # Cost is defined at tier level

        # TODO: Enable and configure this
        alertmanager:
            enabled: false
