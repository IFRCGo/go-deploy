# renovate: datasource=docker depName=lscr.io/linuxserver/openssh-server versioning=regex:^version-(?<major>\d+)\.(?<minor>\d+)_p(?<patch>\d+)-r(?<build>\d+)$
image: "lscr.io/linuxserver/openssh-server:version-10.3_p1-r0"

# Login user: the image creates this account (USER_NAME) and sshd only permits it
# (AllowUsers, in the drop-in). Both are driven from this single value.
user: user

# Free-form environment label (set by Terraform, e.g. "staging" / "production").
environment: ""

service:
  port: 2222
  # Reserved cloud LB IP (set per-cluster). Empty = let the cluster assign one.
  loadBalancerIP: ""
  # Free-form Service annotations — cloud load-balancer settings etc., provided per-cluster
  # (kept generic so the chart isn't tied to any one cloud).
  annotations: {}

persistence:
  # StorageClass for the host-key PVC. Empty = use the cluster's default class. Set
  # per-cluster when a specific RWO class is required. Persisting the volume keeps sshd
  # host keys stable across restarts (no host-key-changed warnings).
  storageClass: ""
  size: 100Mi

resources:
  requests:
    cpu: "0.1"
    memory: "0.05Gi"
  limits:
    cpu: "1"
    memory: "0.2Gi"

# Authorized SSH *public* keys, one entry per key. Concatenated into a single, fully
# declarative authorized_keys file — removing an entry revokes that key's access.
# Provided by Terraform (see resources/bastion.tf); empty here so the chart never ships
# keys of its own.
keys: []
